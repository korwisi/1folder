name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build universal binary
        run: bash build-universal.sh

      - name: Package
        run: |
          dir="onefolder-${GITHUB_REF_NAME}-macos-universal"
          mkdir -p "$dir"
          cp target/universal-release/onefolder "$dir/"
          cp config.example.toml README.md LICENSE "$dir/"
          tar -czf "onefolder-${GITHUB_REF_NAME}-macos-universal.tar.gz" "$dir"

      - name: Attach asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "onefolder-${GITHUB_REF_NAME}-macos-universal.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
