[package]
name = "onefolder"
version = "0.3.0"
edition = "2021"
description = "1folder – Hintergrunddienst, der einen Ordner automatisch organisiert"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
env_logger = "0.11"
hex = "0.4"
lopdf = "0.32"
log = "0.4"
notify = "6"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"
xattr = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
